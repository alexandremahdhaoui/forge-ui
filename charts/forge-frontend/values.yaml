replicaCount: 1

image:
  repository: ghcr.io/alexandremahdhaoui/forge-frontend
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

env:
  FORGE_WORKSPACE_API_URL: "http://localhost:8080"
  WORKSPACES: "/workspaces"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
