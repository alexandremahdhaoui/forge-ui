{{define "layout"}}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>forge-ui</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #24292e; }
        nav { background: #24292e; color: white; padding: 12px 24px; }
        nav a { color: white; text-decoration: none; font-weight: bold; font-size: 1.2em; }
        main { max-width: 1200px; margin: 0 auto; padding: 24px; }
        h1 { margin-bottom: 16px; }
        h2 { margin: 24px 0 12px 0; }
        table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f6f8fa; }
        code { background: #f6f8fa; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
        pre { background: #f6f8fa; padding: 12px; overflow-x: auto; border-radius: 6px; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        details { margin: 8px 0; }
        summary { cursor: pointer; color: #586069; }
        .card { border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin: 12px 0; }
        .status-passed { color: #22863a; font-weight: bold; }
        .status-failed { color: #cb2431; font-weight: bold; }
        .dirty { color: #e36209; }
        .clean { color: #22863a; }
        .mono { font-family: monospace; font-size: 0.9em; }
        .stats-grid { display: flex; gap: 16px; margin: 16px 0; flex-wrap: wrap; }
        .stat-card { border: 1px solid #ddd; border-radius: 6px; padding: 16px 24px; text-align: center; min-width: 120px; }
        .stat-value { font-size: 2em; font-weight: bold; display: block; }
        .stat-label { font-size: 0.85em; color: #586069; }
        .heatmap { border-collapse: collapse; margin: 1em 0; }
        .heatmap td, .heatmap th { text-align: center; padding: 8px 12px; border: 1px solid #ddd; }
        .heatmap th { background-color: #f6f8fa; }
        .cell-passed { background-color: #22863a; color: white; font-weight: bold; }
        .cell-failed { background-color: #cb2431; color: white; font-weight: bold; }
        .cell-nodata { background-color: #e1e4e8; color: #586069; }
    </style>
</head>
<body>
    <nav><a href="/workspaces">forge-ui</a></nav>
    <main>
        {{template "content" .}}
    </main>
</body>
</html>
{{end}}
