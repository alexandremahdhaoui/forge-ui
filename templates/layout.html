{{define "layout"}}
<!DOCTYPE html>
<html lang="en"{{if .DarkMode}} data-theme="dark"{{end}}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>forge-ui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ========================================
           Color Tokens — Catppuccin Latte / Mocha
           ======================================== */

        :root {
            /* Color — Catppuccin accents, vivid lavender surfaces */
            --md-sys-color-primary: #1e66f5;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #dce4fc;
            --md-sys-color-on-primary-container: #102a68;
            --md-sys-color-secondary: #8839ef;
            --md-sys-color-on-secondary: #ffffff;
            --md-sys-color-secondary-container: #eddcfb;
            --md-sys-color-on-secondary-container: #4a1590;
            --md-sys-color-tertiary: #179299;
            --md-sys-color-on-tertiary: #ffffff;
            --md-sys-color-tertiary-container: #c8f0ee;
            --md-sys-color-on-tertiary-container: #064b4d;
            --md-sys-color-error: #d20f39;
            --md-sys-color-on-error: #ffffff;
            --md-sys-color-error-container: #fcdde3;
            --md-sys-color-on-error-container: #5c0016;
            --md-sys-color-surface: #edf0fd;
            --md-sys-color-on-surface: #151730;
            --md-sys-color-surface-variant: #c8d0f8;
            --md-sys-color-on-surface-variant: #3a3d5c;
            --md-sys-color-outline: #5c62a0;
            --md-sys-color-outline-variant: #a8b0e0;
            --md-sys-color-shadow: #000000;
            --md-sys-color-scrim: #000000;
            --md-sys-color-inverse-surface: #1e2044;
            --md-sys-color-inverse-on-surface: #edf0fd;
            --md-sys-color-inverse-primary: #89b4fa;
            --md-sys-color-surface-dim: #c2cae6;
            --md-sys-color-surface-bright: #f8f9ff;
            --md-sys-color-surface-container-lowest: #ffffff;
            --md-sys-color-surface-container-low: #f6f8ff;
            --md-sys-color-surface-container: #dde4ff;
            --md-sys-color-surface-container-high: #d0d8fc;
            --md-sys-color-surface-container-highest: #c2ccf8;
            --md-sys-color-surface-tint: #1e66f5;

            /* Link */
            --md-sys-color-link: #1e66f5;

            /* Semantic status */
            --status-pass: #2e8b20;
            --status-pass-container: #a8e6a0;
            --status-on-pass-container: #1a4d12;
            --status-fail: #d20f39;
            --status-fail-container: #e47888;
            --status-on-fail-container: #5c0016;
            --status-warn: #c07a10;
            --status-warn-container: #eebc5a;
            --status-on-warn-container: #5c3a07;
            --status-info: #1e66f5;
            --status-info-container: #b0cefa;
            --status-on-info-container: #102a68;
            --status-neutral: #5c62a0;
            --status-neutral-container: #c8d0f8;
            --status-on-neutral-container: #3a3d5c;

            /* Typography */
            --md-sys-typescale-brand-font: 'Inter', sans-serif;
            --md-sys-typescale-plain-font: 'Roboto', sans-serif;

            /* Shape */
            --md-sys-shape-corner-none: 0px;
            --md-sys-shape-corner-extra-small: 4px;
            --md-sys-shape-corner-small: 8px;
            --md-sys-shape-corner-medium: 12px;
            --md-sys-shape-corner-large: 16px;
            --md-sys-shape-corner-extra-large: 28px;
            --md-sys-shape-corner-full: 9999px;

            /* Elevation */
            --md-sys-elevation-0: none;
            --md-sys-elevation-1: 0 1px 2px 0 rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
            --md-sys-elevation-2: 0 1px 2px 0 rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15);
            --md-sys-elevation-3: 0 1px 3px 0 rgba(0,0,0,0.3), 0 4px 8px 3px rgba(0,0,0,0.15);
            --md-sys-elevation-4: 0 2px 3px 0 rgba(0,0,0,0.3), 0 6px 10px 4px rgba(0,0,0,0.15);
            --md-sys-elevation-5: 0 4px 4px 0 rgba(0,0,0,0.3), 0 8px 12px 6px rgba(0,0,0,0.15);

            /* Motion */
            --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
            --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
            --md-sys-motion-duration-short: 200ms;
            --md-sys-motion-duration-medium: 400ms;
            --md-sys-motion-duration-long: 600ms;
        }

        /* Color — Catppuccin accents, deep indigo surfaces */
        [data-theme="dark"] {
            --md-sys-color-primary: #89b4fa;
            --md-sys-color-on-primary: #0a0c1e;
            --md-sys-color-primary-container: #243d62;
            --md-sys-color-on-primary-container: #bbd4fc;
            --md-sys-color-secondary: #cba6f7;
            --md-sys-color-on-secondary: #0a0c1e;
            --md-sys-color-secondary-container: #462d72;
            --md-sys-color-on-secondary-container: #dcbffa;
            --md-sys-color-tertiary: #94e2d5;
            --md-sys-color-on-tertiary: #0a0c1e;
            --md-sys-color-tertiary-container: #1a504e;
            --md-sys-color-on-tertiary-container: #b2ede6;
            --md-sys-color-error: #f38ba8;
            --md-sys-color-on-error: #0a0c1e;
            --md-sys-color-error-container: #662030;
            --md-sys-color-on-error-container: #f8b6ca;
            --md-sys-color-surface: #12142a;
            --md-sys-color-on-surface: #d6dcf6;
            --md-sys-color-surface-variant: #262842;
            --md-sys-color-on-surface-variant: #b0b6da;
            --md-sys-color-outline: #7478ae;
            --md-sys-color-outline-variant: #3a3c5c;
            --md-sys-color-shadow: #000000;
            --md-sys-color-scrim: #000000;
            --md-sys-color-inverse-surface: #d6dcf6;
            --md-sys-color-inverse-on-surface: #12142a;
            --md-sys-color-inverse-primary: #1e66f5;
            --md-sys-color-surface-dim: #0c0d1e;
            --md-sys-color-surface-bright: #32355a;
            --md-sys-color-surface-container-lowest: #0a0b18;
            --md-sys-color-surface-container-low: #1c1e36;
            --md-sys-color-surface-container: #262848;
            --md-sys-color-surface-container-high: #34375c;
            --md-sys-color-surface-container-highest: #424670;
            --md-sys-color-surface-tint: #89b4fa;

            /* Link */
            --md-sys-color-link: #89b4fa;

            /* Semantic status */
            --status-pass: #a6e3a1;
            --status-pass-container: #1a3d1a;
            --status-on-pass-container: #b5e8b2;
            --status-fail: #f38ba8;
            --status-fail-container: #5e1528;
            --status-on-fail-container: #f8b6ca;
            --status-warn: #f9e2af;
            --status-warn-container: #4a3000;
            --status-on-warn-container: #f7dba0;
            --status-info: #89b4fa;
            --status-info-container: #243d62;
            --status-on-info-container: #bbd4fc;
            --status-neutral: #b0b6da;
            --status-neutral-container: #262842;
            --status-on-neutral-container: #b0b6da;
        }

        /* ========================================
           Typography — M3 Type Scale
           ======================================== */

        .display-large   { font-family: var(--md-sys-typescale-brand-font); font-weight: 400; font-size: 57px; line-height: 64px; letter-spacing: -0.25px; }
        .display-medium  { font-family: var(--md-sys-typescale-brand-font); font-weight: 400; font-size: 45px; line-height: 52px; letter-spacing: 0; }
        .display-small   { font-family: var(--md-sys-typescale-brand-font); font-weight: 400; font-size: 36px; line-height: 44px; letter-spacing: 0; }
        .headline-large  { font-family: var(--md-sys-typescale-brand-font); font-weight: 400; font-size: 32px; line-height: 40px; letter-spacing: 0; }
        .headline-medium { font-family: var(--md-sys-typescale-brand-font); font-weight: 400; font-size: 28px; line-height: 36px; letter-spacing: 0; }
        .headline-small  { font-family: var(--md-sys-typescale-brand-font); font-weight: 400; font-size: 24px; line-height: 32px; letter-spacing: 0; }
        .title-large     { font-family: var(--md-sys-typescale-brand-font); font-weight: 500; font-size: 22px; line-height: 28px; letter-spacing: 0; }
        .title-medium    { font-family: var(--md-sys-typescale-plain-font); font-weight: 500; font-size: 16px; line-height: 24px; letter-spacing: 0.15px; }
        .title-small     { font-family: var(--md-sys-typescale-plain-font); font-weight: 500; font-size: 15px; line-height: 22px; letter-spacing: 0.1px; }
        .body-large      { font-family: var(--md-sys-typescale-plain-font); font-weight: 400; font-size: 17px; line-height: 26px; letter-spacing: 0.5px; }
        .body-medium     { font-family: var(--md-sys-typescale-plain-font); font-weight: 400; font-size: 15px; line-height: 22px; letter-spacing: 0.25px; }
        .body-small      { font-family: var(--md-sys-typescale-plain-font); font-weight: 400; font-size: 13px; line-height: 18px; letter-spacing: 0.4px; }
        .label-large     { font-family: var(--md-sys-typescale-plain-font); font-weight: 500; font-size: 15px; line-height: 22px; letter-spacing: 0.1px; }
        .label-medium    { font-family: var(--md-sys-typescale-plain-font); font-weight: 500; font-size: 13px; line-height: 18px; letter-spacing: 0.5px; }
        .label-small     { font-family: var(--md-sys-typescale-plain-font); font-weight: 500; font-size: 12px; line-height: 16px; letter-spacing: 0.5px; }

        /* ========================================
           Reset & Base
           ======================================== */

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--md-sys-typescale-plain-font);
            font-size: 16px;
            line-height: 1.5;
            color: var(--md-sys-color-on-surface);
            background-color: var(--md-sys-color-surface);
            -webkit-font-smoothing: antialiased;
        }

        /* ========================================
           Top App Bar — Small (64px)
           ======================================== */

        .top-app-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            height: 64px;
            padding: 0 24px;
            background-color: var(--md-sys-color-surface-container);
            box-shadow: var(--md-sys-elevation-2);
        }

        .top-app-bar__title {
            color: var(--md-sys-color-on-surface);
            text-decoration: none;
            font-family: var(--md-sys-typescale-brand-font);
            font-weight: 700;
        }

        .top-app-bar__title:hover {
            text-decoration: none;
            opacity: 0.87;
        }

        .top-app-bar__spacer { flex: 1; }

        /* Theme toggle */
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--md-sys-shape-corner-full);
            color: var(--md-sys-color-on-surface-variant);
            text-decoration: none;
            transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
        }

        .theme-toggle:hover {
            background-color: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 8%, transparent);
            text-decoration: none;
        }

        .theme-toggle svg { fill: currentColor; }

        .theme-icon--dark  { display: none; }
        .theme-icon--light { display: inline; }

        [data-theme="dark"] .theme-icon--dark  { display: inline; }
        [data-theme="dark"] .theme-icon--light { display: none; }

        /* ========================================
           Page Content
           ======================================== */

        .page-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ========================================
           Cards
           ======================================== */

        .card-filled {
            background-color: var(--md-sys-color-surface-container-highest);
            border-radius: var(--md-sys-shape-corner-medium);
            padding: 16px;
        }

        .card-elevated {
            background-color: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-sys-shape-corner-medium);
            padding: 16px;
            box-shadow: var(--md-sys-elevation-1);
        }

        .card-outlined {
            background-color: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-medium);
            padding: 16px;
        }

        /* ========================================
           Stat Cards
           ======================================== */

        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0;
        }

        .stat-card {
            background-color: var(--md-sys-color-surface-container-highest);
            border-radius: var(--md-sys-shape-corner-medium);
            padding: 16px 24px;
            text-align: center;
            min-width: 120px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            display: block;
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-sys-typescale-brand-font);
        }

        .stat-label {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            font-family: var(--md-sys-typescale-plain-font);
            font-weight: 500;
            letter-spacing: 0.4px;
            margin-top: 4px;
        }

        .stat-value--pass { color: var(--status-pass); }
        .stat-value--fail { color: var(--status-fail); }

        /* ========================================
           Segmented Buttons
           ======================================== */

        .segmented-btn-group {
            display: inline-flex;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--md-sys-shape-corner-full);
            overflow: hidden;
            margin: 16px 0;
        }

        .segmented-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            font-family: var(--md-sys-typescale-plain-font);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.1px;
            color: var(--md-sys-color-on-surface);
            background: transparent;
            text-decoration: none;
            border-right: 1px solid var(--md-sys-color-outline);
            transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
        }

        .segmented-btn:last-child { border-right: none; }
        .segmented-btn:hover { background-color: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); text-decoration: none; }

        .segmented-btn--active {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }

        .segmented-btn--active:hover {
            background-color: color-mix(in srgb, var(--md-sys-color-on-secondary-container) 8%, var(--md-sys-color-secondary-container));
        }

        /* ========================================
           Chips — Semantic Status
           ======================================== */

        .chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: var(--md-sys-shape-corner-small);
            font-family: var(--md-sys-typescale-plain-font);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .chip--pass {
            background-color: var(--status-pass-container);
            color: var(--status-on-pass-container);
        }

        .chip--fail {
            background-color: var(--status-fail-container);
            color: var(--status-on-fail-container);
        }

        .chip--warn {
            background-color: var(--status-warn-container);
            color: var(--status-on-warn-container);
        }

        .chip--info {
            background-color: var(--status-info-container);
            color: var(--status-on-info-container);
        }

        .chip--neutral {
            background-color: var(--status-neutral-container);
            color: var(--status-on-neutral-container);
        }

        /* ========================================
           Data Table
           ======================================== */

        .data-table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
            background-color: var(--md-sys-color-surface-container-low);
        }

        .data-table th,
        .data-table td {
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            padding: 12px 16px;
            text-align: left;
            font-size: 15px;
        }

        .data-table th {
            font-family: var(--md-sys-typescale-plain-font);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.4px;
            color: var(--md-sys-color-on-surface-variant);
            background-color: var(--md-sys-color-surface-container);
            transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
            cursor: default;
        }

        .data-table th:hover {
            background-color: var(--md-sys-color-surface-container-high);
        }

        .data-table td {
            font-family: var(--md-sys-typescale-plain-font);
            color: var(--md-sys-color-on-surface);
        }

        .data-table tbody tr {
            transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
        }

        .data-table tbody tr:hover {
            background-color: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
        }

        /* ========================================
           Heatmap
           ======================================== */

        .heatmap-table {
            border-collapse: separate;
            border-spacing: 3px;
        }

        .heatmap-table th,
        .heatmap-table td {
            text-align: center;
            padding: 10px 16px;
            border-bottom: none;
            font-size: 14px;
            font-weight: 500;
            transition: filter var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                        transform var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
        }

        .heatmap-table td:hover {
            filter: brightness(0.9);
            transform: scale(1.04);
            cursor: default;
        }

        .cell-passed {
            background-color: var(--status-pass-container);
            color: var(--status-on-pass-container);
            font-weight: 600;
            border-radius: var(--md-sys-shape-corner-extra-small);
        }

        .cell-failed {
            background-color: var(--status-fail-container);
            color: var(--status-on-fail-container);
            font-weight: 600;
            border-radius: var(--md-sys-shape-corner-extra-small);
        }

        .cell-nodata {
            background-color: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
            border-radius: var(--md-sys-shape-corner-extra-small);
        }

        /* ========================================
           Code
           ======================================== */

        .code-inline {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85em;
            background-color: var(--md-sys-color-surface-container-high);
            padding: 2px 8px;
            border-radius: var(--md-sys-shape-corner-extra-small);
        }

        .code-block {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85em;
            background-color: var(--md-sys-color-surface-container-high);
            padding: 12px 16px;
            border-radius: var(--md-sys-shape-corner-small);
            border: 1px solid var(--md-sys-color-outline-variant);
            overflow-x: auto;
            white-space: pre;
        }

        /* ========================================
           Empty State
           ======================================== */

        .empty-state {
            color: var(--md-sys-color-on-surface-variant);
            padding: 24px;
        }

        /* ========================================
           Links
           ======================================== */

        a {
            color: var(--md-sys-color-link);
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

        /* ========================================
           Dividers
           ======================================== */

        hr {
            border: none;
            border-top: 1px solid var(--md-sys-color-outline-variant);
            margin: 16px 0;
        }

        /* ========================================
           Details / Summary
           ======================================== */

        details { margin: 8px 0; }

        summary {
            cursor: pointer;
            color: var(--md-sys-color-link);
            font-family: var(--md-sys-typescale-plain-font);
            font-size: 15px;
            font-weight: 500;
            padding: 4px 0;
            list-style: none;
        }

        summary::-webkit-details-marker { display: none; }

        summary::before {
            content: '\25B6';
            display: inline-block;
            margin-right: 8px;
            font-size: 10px;
            transition: transform var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
        }

        details[open] > summary::before {
            transform: rotate(90deg);
        }

        /* ========================================
           Breadcrumb
           ======================================== */

        .breadcrumb {
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 8px;
        }

        .breadcrumb a {
            color: var(--md-sys-color-link);
        }

        /* ========================================
           Headings (contextual)
           ======================================== */

        h1 { margin-bottom: 8px; }
        h2 { margin: 32px 0 12px 0; }

        /* ========================================
           Responsive
           ======================================== */

        @media (max-width: 600px) {
            .page-content { padding: 16px; }
            .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
            .top-app-bar { padding: 0 16px; }
        }
    </style>
</head>
<body>
    <header class="top-app-bar">
        <a href="{{.HomeURL}}" class="top-app-bar__title title-large">forge-ui</a>
        <span class="top-app-bar__spacer"></span>
