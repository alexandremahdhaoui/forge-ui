name: forge-ui

envFile: .envrc
artifactStorePath: .forge/artifact-store.yaml

engines:
  - alias: wasm-build
    type: builder
    builder:
      - engine: go://generic-builder

  - alias: generate-mocks
    type: builder
    builder:
      - engine: go://generic-builder
        spec:
          command: "rm"
          args: ["-rf", "./internal/util/mocks"]
      - engine: go://go-gen-mocks

  - alias: web-assets
    type: builder
    builder:
      - engine: go://generic-builder

build:
  - name: forge-ui
    src: ./cmd/forge-ui
    dest: ./build/bin
    engine: go://go-build

  - name: forge-ui-wasm
    src: ./cmd/forge-ui-wasm
    dest: ./build/web
    engine: alias://wasm-build
    spec:
      command: "go"
      args: ["build", "-o", "./build/web/forge-ui.wasm", "./cmd/forge-ui-wasm"]
      env:
        GOOS: "js"
        GOARCH: "wasm"

  - name: forge-ui-web-assets
    src: ./web
    dest: ./build/web
    engine: alias://web-assets
    spec:
      command: "cp"
      args: ["-r", "./web/.", "./build/web/"]

  - name: generate-mocks
    src: .
    engine: alias://generate-mocks

test:
  - name: lint
    runner: "go://go-lint"

  - name: unit
    runner: "go://go-test"
